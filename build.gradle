// RU: общее для всех частей; что собирается под какой загрузчик - в их собственных build.gradle
// US: shared by every part; what is built for which loader lives in their own build.gradle
def buildInfoDir = layout.buildDirectory.dir("generated/sources/buildinfo")

// RU: номер мода для кода (аддон Plasmo Voice); иначе его пришлось бы менять руками в двух местах
// US: the mod version for the code (the Plasmo Voice addon); otherwise it would be changed by hand in two places
def generateBuildInfo = tasks.register("generateBuildInfo") {
    def version = mod_base_version
    inputs.property("version", version)
    outputs.dir(buildInfoDir)
    doLast {
        def file = buildInfoDir.get().file("dev/famjam/radiofm/BuildInfo.java").asFile
        file.parentFile.mkdirs()
        file.text = """package dev.famjam.radiofm;

public final class BuildInfo {

    public static final String VERSION = "${version}";

    private BuildInfo() {
    }
}
"""
    }
}

subprojects {
    apply plugin: 'java'

    group = maven_group

    repositories {
        mavenCentral()
        maven { url = 'https://maven.maxhenkel.de/repository/public' }
        maven { url = 'https://maven.lavalink.dev/releases' }
        maven { url = 'https://maven.lavalink.dev/snapshots' }
        maven { url = 'https://repo.plasmoverse.com/releases' }
        maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    if (project.name != 'youtube-patch') {
        sourceSets.main.java.srcDir(generateBuildInfo)
    }
}
