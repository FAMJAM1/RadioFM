pluginManagement {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
    plugins {
        id 'net.neoforged.moddev' version '2.0.+'
        id 'com.gradleup.shadow' version '9.4.0'
    }
}

rootProject.name = 'RadioFM'
include('youtube-patch')
include('common')
include('neoforge')
