modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/FAMJAM1/RadioFM/issues"

# RU: открывает поля звукового движка, чтобы радио своего канала не вставало на паузу в меню
# US: opens sound engine fields so our channel's radios do not pause in the menu
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mods]]
modId = "${mod_id}"
version = "${mod_base_version}"
displayName = "${mod_title}"
displayURL = "https://github.com/FAMJAM1/RadioFM"
logoFile = "radiofm_logo.png"
# RU: без этого иконку растянет со сглаживанием | US: without this the icon is smoothed when scaled
logoBlur = false
authors = "FAMJAM"
description = "A radio for Simple Voice Chat or Plasmo Voice. Shown only where the mod has no translation of its own."

[[dependencies.radiofm]]
# RU: диапазоны закрыты сверху: сборка под 1.21.1 в другой версии игры упадёт, пусть лучше не грузится
# US: ranges are closed above: a 1.21.1 build would crash in another game version, better not to load at all
modId = "neoforge"
type = "required"
versionRange = "[21.1,21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.radiofm]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

# RU: нужен один из двух голосовых модов, какой - решаем при запуске
# US: one of the two voice mods is needed, which one is decided at startup
[[dependencies.radiofm]]
modId = "voicechat"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.radiofm]]
modId = "plasmovoice"
type = "optional"
versionRange = "[2.1,)"
# RU: аддон регистрируем в своём конструкторе, PV к этому времени должен быть загружен
# US: the addon is registered in our constructor, PV has to be loaded by then
ordering = "AFTER"
side = "BOTH"
